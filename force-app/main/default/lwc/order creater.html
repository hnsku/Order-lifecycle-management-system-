<template>
    <lightning-card title="Create Order" icon-name="standard:orders">
        <div class="slds-p-around_medium">

            <!-- Add Product Button -->
            <lightning-button
                label="Add Product"
                icon-name="utility:add"
                onclick={handleAddProduct}
                class="slds-m-bottom_medium">
            </lightning-button>

            <!-- Product List -->
            <template for:each={products} for:item="prod" for:index="index">
                <div key={prod.pbeId} class="slds-box slds-m-bottom_small slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-input
                            label="PricebookEntry ID"
                            value={prod.pbeId}
                            data-index={index}
                            onchange={handleProductChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-input
                            type="number"
                            label="Quantity"
                            value={prod.qty}
                            data-index={index}
                            onchange={handleProductChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-input
                            type="number"
                            label="Unit Price"
                            value={prod.price}
                            data-index={index}
                            onchange={handleProductChange}>
                        </lightning-input>
                    </div>
                </div>
            </template>

            <!-- Create Order Button -->
            <div class="slds-m-top_large slds-text-align_center">
                <lightning-button
                    label="Create Order"
                    variant="brand"
                    icon-name="utility:save"
                    onclick={handleCreateOrder}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
